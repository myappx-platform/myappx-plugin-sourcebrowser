<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<title>Source Viewer</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			background: #1e1e1e;
			color: #ddd;
		}
		html[data-theme="vs"] { background: #fff; color: #222; }
		#bar {
			flex: 0 0 28px;
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 8px;
			padding: 0 10px;
			box-sizing: border-box;
			border-bottom: 1px solid #3c3c3c;
			background: #252526;
			font: 12px/1 system-ui, sans-serif;
		}
		html[data-theme="vs"] #bar {
			background: #f3f3f3;
			border-bottom-color: #ddd;
		}
		#theme-label { opacity: 0.8; }
		#theme-sel {
			font: 12px system-ui, sans-serif;
			padding: 1px 4px;
		}
		#msg {
			font: 13px/1.4 system-ui, sans-serif;
			padding: 16px;
			color: #444;
			display: none;
		}
		html[data-theme="vs-dark"] #msg { color: #ccc; }
		#msg.error { display: block; color: #f14c4c; }
		html[data-theme="vs"] #msg.error { color: #a1260d; }
		#ed { flex: 1; min-height: 0; width: 100%; }
		.src-line-highlight { background: rgba(22, 163, 74, 0.22) !important; }
		html[data-theme="vs-dark"] .src-line-highlight {
			background: rgba(34, 197, 94, 0.28) !important;
		}
	</style>
	<script>
		(function () {
			var t = 'vs-dark';
			try { t = localStorage.getItem('myappx.sourcebrowser.theme') || t; } catch (e) {}
			if (t !== 'vs' && t !== 'vs-dark') {
				t = 'vs-dark';
			}
			document.documentElement.setAttribute('data-theme', t);
		})();
	</script>
</head>
<body>
	<div id="bar">
		<label id="theme-label" for="theme-sel">Theme</label>
		<select id="theme-sel"></select>
	</div>
	<div id="msg"></div>
	<div id="ed"></div>
	<script src="vs/loader.js"></script>
	<script src="viewer.js"></script>
</body>
</html>
